<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiscoKING</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #9ddcff 0%, #dff5ff 45%, #cfeeff 100%);
      color: #123a62;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }
    .sky {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 25%, rgba(255,255,255,0.65), transparent 26%),
        radial-gradient(circle at 74% 18%, rgba(255,255,255,0.55), transparent 30%),
        linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
      z-index: 0;
    }
    .cloud {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.7);
      filter: blur(2px);
      opacity: 0.9;
      animation: drift 16s ease-in-out infinite;
    }
    .cloud.c1 { width: 180px; height: 46px; left: 8%; top: 16%; }
    .cloud.c2 { width: 220px; height: 52px; right: 12%; top: 18%; animation-delay: 4s; }
    .cloud.c3 { width: 170px; height: 42px; left: 32%; bottom: 18%; animation-delay: 7s; }
    @keyframes drift {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(18px); }
    }
    .panel {
      position: relative;
      z-index: 1;
      width: min(940px, 92vw);
      background: rgba(255,255,255,0.66);
      border: 1px solid rgba(18, 82, 142, 0.15);
      border-radius: 28px;
      box-shadow: 0 30px 85px rgba(36, 96, 161, 0.14);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.02fr 1fr;
      backdrop-filter: blur(10px);
    }
    .left {
      background: rgba(1, 52, 94, 0.06);
      padding: 34px 30px 28px;
      border-right: 1px solid rgba(18, 82, 142, 0.1);
    }

    .spark {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      position: relative;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 24px rgba(255, 214, 92, 0.75));
    }

    .spark::before,
    .spark::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #fff4a6 0%, #ffd75c 35%, #ffb300 100%);
      clip-path: polygon(50% 0%, 62% 34%, 100% 50%, 62% 66%, 50% 100%, 38% 66%, 0% 50%, 38% 34%);
      transform: rotate(12deg);
      border-radius: 12px;
    }

    .spark::after {
      inset: 14px;
      background: linear-gradient(135deg, #fff7d1 0%, #ffd95d 32%, #ffb700 100%);
      clip-path: polygon(50% 0%, 62% 34%, 100% 50%, 62% 66%, 50% 100%, 38% 66%, 0% 50%, 38% 34%);
      transform: rotate(22deg);
      opacity: 0.9;
    }

    .spark-core {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle, #fffdf0 0%, #ffe47d 35%, #ffbb00 100%);
      box-shadow: 0 0 18px rgba(255, 190, 0, 0.7);
    }

    .brand {
      text-align: center;
      margin-bottom: 20px;
    }
    .brand h1 {
      margin: 0;
      font-size: clamp(2.3rem, 3vw, 3.1rem);
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, #0f5fa8, #0f8fe2 58%, #4ac3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand p {
      margin: 10px 0 0;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #215b93;
    }
    .info-card {
      background: rgba(255,255,255,0.36);
      border: 1px solid rgba(18, 82, 142, 0.1);
      border-radius: 18px;
      padding: 18px 18px 16px;
      color: #123a62;
    }
    .info-card h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }
    .info-card ul {
      margin: 0;
      padding-left: 18px;
      line-height: 1.7;
      font-size: 0.96rem;
      color: #214d78;
    }
    .right {
      padding: 32px 26px 28px;
      background: rgba(255,255,255,0.18);
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 12px;
      background: rgba(12, 101, 179, 0.08);
      border: 1px solid rgba(18, 82, 142, 0.12);
      border-radius: 12px;
      font-weight: 800;
      color: #123a62;
      cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(135deg, #0e72ce, #4ac3ff);
      border-color: transparent;
      color: white;
      box-shadow: 0 14px 24px rgba(20, 127, 215, 0.26);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
      color: #123a62;
      font-weight: 700;
    }
    input {
      width: 100%;
      border: 1px solid rgba(18, 82, 142, 0.2);
      border-radius: 12px;
      background: rgba(255,255,255,0.72);
      padding: 13px 14px;
      font-size: 0.98rem;
      color: #123a62;
      outline: none;
    }
    input:focus {
      border-color: rgba(16, 122, 214, 0.7);
      box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.12);
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, #0d62c8, #46b8ff);
      color: white;
      box-shadow: 0 16px 30px rgba(20, 102, 179, 0.25);
    }
    .helper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 6px;
      color: #234f7a;
      font-size: 0.85rem;
    }
    .helper a {
      color: #0d62c8;
      text-decoration: none;
      font-weight: 800;
    }
    .msg {
      display: none;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
    }
    .msg.error {
      display: block;
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.18);
      color: #9d2d28;
    }
    .msg.success {
      display: block;
      background: rgba(39, 174, 96, 0.1);
      border: 1px solid rgba(39, 174, 96, 0.18);
      color: #1d7a44;
    }
    @media (max-width: 760px) {
      .panel { grid-template-columns: 1fr; }
      .left { border-right: none; border-bottom: 1px solid rgba(18, 82, 142, 0.1); }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="panel">
    <div class="left">
      <div class="spark"><div class="spark-core"></div></div>
      <div class="brand">
        <h1>DiscoKING</h1>
        <p>AI command layer</p>
      </div>

      <div class="info-card">
        <h3>Private AI workspace</h3>
        <ul>
          <li>Hermes + Forgejo orchestration</li>
          <li>Sandboxed upload/download control</li>
          <li>Private vault + auto mode</li>
          <li>Hidden free model pool</li>
          <li>Tooling, skills, and repo sync</li>
        </ul>
      </div>
    </div>

    <div class="right">
      <div class="tabs">
        <div class="tab active" data-mode="login">Login</div>
        <div class="tab" data-mode="signup">Sign up</div>
      </div>

      <form id="loginForm">
        <label>
          Username
          <input type="text" id="loginUser" placeholder="Enter username" />
        </label>

        <label>
          Password
          <input type="password" id="loginPass" placeholder="Enter password" />
        </label>

        <button class="btn btn-primary" type="submit">Unlock</button>

        <div class="helper" aria-hidden="true">
          <span>Private access</span>
        </div>

        <div id="loginMsg" class="msg"></div>
      </form>

      <form id="signupForm" style="display:none;">
        <label>
          Username
          <input type="text" id="signupUser" placeholder="Choose username" />
        </label>

        <label>
          Email
          <input type="email" id="signupEmail" placeholder="you@example.com" />
        </label>

        <label>
          Password
          <input type="password" id="signupPass" placeholder="Create password" />
        </label>

        <label>
          Confirm password
          <input type="password" id="signupConfirm" placeholder="Confirm password" />
        </label>

        <button class="btn btn-primary" type="submit">Create account</button>
        <div id="signupMsg" class="msg"></div>
      </form>
    </div>
  </div>

  <script>
    const tabs = document.querySelectorAll('.tab');
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const loginMsg = document.getElementById('loginMsg');
    const signupMsg = document.getElementById('signupMsg');

    const DEFAULT_LOGIN = { user: 'guest', password: 'imdog' };
    const ADMIN = { user: 'majortom', password: 'sicosico6' };

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');

        if (tab.dataset.mode === 'login') {
          loginForm.style.display = 'flex';
          signupForm.style.display = 'none';
        } else {
          loginForm.style.display = 'none';
          signupForm.style.display = 'flex';
        }
      });
    });

    loginForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;

      if (!user || !pass) {
        loginMsg.textContent = 'Please fill in both fields.';
        loginMsg.className = 'msg error';
        return;
      }

      const saved = JSON.parse(localStorage.getItem('discokingUsers') || '{}');
      const isDefault = user === DEFAULT_LOGIN.user && pass === DEFAULT_LOGIN.password;
      const isAdmin = user === ADMIN.user && pass === ADMIN.password;
      const isSavedUser = saved[user] && saved[user].password === pass;

      if (isDefault || isAdmin || isSavedUser) {
        localStorage.setItem('discokingAuth', 'true');
        localStorage.setItem('discokingUser', user);
        localStorage.setItem('discokingRole', isAdmin ? 'admin' : (isDefault ? 'guest' : 'user'));
        window.location.href = 'app.html';
      } else {
        loginMsg.textContent = 'Invalid username or password.';
        loginMsg.className = 'msg error';
      }
    });

    signupForm.addEventListener('submit', (event) => {
      event.preventDefault();

      const user = document.getElementById('signupUser').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const pass = document.getElementById('signupPass').value;
      const confirmPass = document.getElementById('signupConfirm').value;

      if (!user || !email || !pass || !confirmPass) {
        signupMsg.textContent = 'Complete all fields.';
        signupMsg.className = 'msg error';
        return;
      }
      if (pass.length < 6) {
        signupMsg.textContent = 'Password must be at least 6 characters.';
        signupMsg.className = 'msg error';
        return;
      }
      if (pass !== confirmPass) {
        signupMsg.textContent = 'Passwords do not match.';
        signupMsg.className = 'msg error';
        return;
      }

      const saved = JSON.parse(localStorage.getItem('discokingUsers') || '{}');
      if (saved[user]) {
        signupMsg.textContent = 'Username already exists.';
        signupMsg.className = 'msg error';
        return;
      }

      saved[user] = { email, password: pass };
      localStorage.setItem('discokingUsers', JSON.stringify(saved));

      signupMsg.textContent = 'Account created successfully. You can now log in.';
      signupMsg.className = 'msg success';
      signupForm.reset();

      setTimeout(() => {
        tabs.forEach((t) => t.classList.remove('active'));
        document.querySelector('.tab[data-mode="login"]').classList.add('active');
        loginForm.style.display = 'flex';
        signupForm.style.display = 'none';
      }, 1200);
    });

    if (localStorage.getItem('discokingAuth') === 'true') {
      window.location.href = 'app.html';
    }
  </script>
</body>
</html>
